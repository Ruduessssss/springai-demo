spring:
  ai:
    openai:
      base-url: ${MODEL_BASE_URL}
      api-key: ${MODEL_API_KEY}
      chat:
        completions-path: /chat/completions
        options:
          model: ${MODEL_NAME}
    mcp:
      client:
        sse:
          connections:
            global-date-times:
              url: http://localhost:8080
              sse-endpoint: /sse

        enabled: true
        name: time-mcp
        version: 1.0.0
        request-timeout: 30s
        type: async


# 修改日志级别
logging:
  level:
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: debug
server:
  port: 8081