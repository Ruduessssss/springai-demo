spring:
  ai:
    openai:
      base-url: ${MODEL_BASE_URL}
      api-key: ${MODEL_API_KEY}
      chat:
        completions-path: /chat/completions
        options:
          model: ${MODEL_NAME}
  thymeleaf:
    cache: false

server:
  port: 8080

# 修改日志级别
logging:
  level:
    com.git.hui.springai.app.advisor.MyLoggingAdvisor: debug