spring:
  thymeleaf:
    cache: false
  ai:
    openai:
      base-url: ${MODEL_BASE_URL}
      api-key: ${MODEL_API_KEY}
      chat:
        completions-path: /chat/completions
        options:
          model: ${MODEL_NAME}
      image:
        images-path: /images/generations
        options:
          model: ${MODEL_IMAGE_NAME:gpt-image-1}

